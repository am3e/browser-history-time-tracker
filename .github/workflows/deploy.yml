name: Deploy

on:
  push:
    branches: [main]
    paths: [index.html]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  BUCKET: timetracker.am3e.dev
  DISTRIBUTION_ID: E18QFD4OANDX5B

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::725445055643:role/github-actions-timetracker-deploy
          aws-region: us-east-1

      - name: Upload to S3
        run: aws s3 cp index.html "s3://$BUCKET/index.html" --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/index.html" "/"
